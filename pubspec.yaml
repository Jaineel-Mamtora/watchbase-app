name: watchbase_app
description: 'WatchBase - Everything worth watching, in one place'

publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.13.2

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^4.0.0
  cupertino_icons: ^1.0.9
  cupertino_ui: ^1.0.2
  dio: ^5.11.1
  dynamic_color: ^2.1.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.1.1
  skeletonizer: ^2.1.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
